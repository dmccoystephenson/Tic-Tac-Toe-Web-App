# Builds the app and deploys it to arcade (https://github.com/Stephenson-Software/arcade,
# RFC 0012 `kind: static`), where it is served at
# https://tic-tac-toe-web.play.danielstephenson.dev and listed at danielstephenson.dev/play.
#
# Every pull request tests and builds it. A push to Main deploys it once the repository
# variable ARCADE_ENABLED is 'true' (or by hand: Actions -> Run workflow).
name: Browser build

on:
  pull_request:
  push:
    branches: [ Main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npx react-scripts test --watchAll=false
        env:
          CI: true
      - name: Build (relative asset paths, from the homepage field)
        run: npm run build
      - name: The build is a self-contained site
        run: |
          test -f build/index.html
          grep -q 'src="./static/js/' build/index.html
          # the 3D board: Strata's grid relay, fetched by scripts/fetch-strata.js (prebuild)
          for f in grid-relay-scene.js grid-relay-scene.wasm grid-relay.js strata-kit.js strata-loader.js; do
            test -s "build/strata/$f"
          done
      - name: Play the build in headless Chromium, in 3D and 2D (e2e/board3d.cjs)
        run: |
          mkdir -p "$RUNNER_TEMP/e2e" && cd "$RUNNER_TEMP/e2e"
          npm install --no-save --no-package-lock playwright@1.65.1
          npx playwright install --with-deps chromium
          NODE_PATH="$RUNNER_TEMP/e2e/node_modules" node "$GITHUB_WORKSPACE/e2e/board3d.cjs" \
            "$GITHUB_WORKSPACE/build" "$RUNNER_TEMP/e2e/shots"
      - name: Keep the browser screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: board3d
          path: ${{ runner.temp }}/e2e/shots
          if-no-files-found: ignore
      - name: Version this build (version.txt + commit)
        run: echo "$(tr -d '[:space:]' < version.txt)+g${GITHUB_SHA::7}" > build-version.txt
      - name: Deploy to arcade
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && vars.ARCADE_ENABLED == 'true')
        uses: Stephenson-Software/arcade-deploy@v1
        with:
          slug: tic-tac-toe-web
          token: ${{ secrets.ARCADE_TOKEN }}
          site-dir: build
          version-file: build-version.txt
